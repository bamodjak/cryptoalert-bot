name: Render free-service heartbeat

on:
  push:
    branches:
      - main
  schedule:
    # Best-effort inbound traffic to prevent the free web service from idling.
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: render-free-service-heartbeat
  cancel-in-progress: true

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check Render application health and retry cold starts
        shell: bash
        env:
          SERVICE_URL: https://cryptoalert-bot-i0ev.onrender.com
        run: |
          set -u
          for attempt in 1 2 3 4 5; do
            echo "Health check attempt ${attempt}/5"
            status="$(curl --silent --show-error --location --max-time 20 \
              --output /tmp/render-response.txt --write-out '%{http_code}' \
              "${SERVICE_URL}/health" 2>/tmp/curl-error.txt || true)"
            if [[ "${status}" == "200" ]]; then
              echo "Render application health is OK (HTTP ${status})"
              cat /tmp/render-response.txt
              exit 0
            fi
            echo "Application health is not ready (status=${status:-none})"
            cat /tmp/render-response.txt 2>/dev/null || true
            cat /tmp/curl-error.txt || true
            if [[ "${attempt}" -lt 5 ]]; then sleep 15; fi
          done
          echo "Render application health did not recover after retries."
          exit 1
