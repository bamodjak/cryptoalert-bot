name: tests
on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: bot
          POSTGRES_PASSWORD: bot
          POSTGRES_DB: bot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bot -d bot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      BOT_TOKEN: "123456:ci-placeholder-token"
      DATABASE_URL: "postgresql+asyncpg://bot:bot@localhost:5432/bot"
      REDIS_URL: "redis://localhost:6379/0"
      PYTHONPATH: "."
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt pytest
      - run: python -m compileall -q app alembic tests
      - run: python -c "import app.main; import app.admin_tools; print('application imports ok')"
      - run: alembic upgrade head --sql > /tmp/migration.sql
      - run: alembic upgrade head
      - run: pytest -q
